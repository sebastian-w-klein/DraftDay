services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-draftday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-draftday}
      POSTGRES_DB: ${POSTGRES_DB:-draftday}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-draftday} -d ${POSTGRES_DB:-draftday}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-draftday}:${POSTGRES_PASSWORD:-draftday}@db:5432/${POSTGRES_DB:-draftday}
      ENABLE_DRAFT_INTELLIGENCE: ${ENABLE_DRAFT_INTELLIGENCE:-true}
      ENABLE_ORG_INTELLIGENCE: ${ENABLE_ORG_INTELLIGENCE:-true}

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.pi
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:8000}

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - api
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
