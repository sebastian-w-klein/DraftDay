[project]
name = "draftday"
version = "0.1.0"
description = "NFL Mock Draft Aggregator and Consensus Prediction System"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.41",
  "alembic>=1.16.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "httpx>=0.28.0",
  "beautifulsoup4>=4.13.0",
  "selectolax>=0.3.30",
  "playwright>=1.54.0",
  "apscheduler>=3.11.0",
  "tenacity>=9.1.0",
  "structlog>=25.4.0",
  "python-slugify>=8.0.4",
  "scikit-learn>=1.7.0",
  "lightgbm>=4.6.0",
  "shap>=0.48.0",
]

[project.optional-dependencies]
research = [
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
  "scipy>=1.13.0",
  "statsmodels>=0.14.2",
]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
  "black>=25.1.0",
  "mypy>=1.17.0",
  "pre-commit>=4.3.0",
]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "backend*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
