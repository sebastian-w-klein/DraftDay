services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: draftday
      POSTGRES_PASSWORD: draftday
      POSTGRES_DB: draftday
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://draftday:draftday@db:5432/draftday

volumes:
  postgres_data:
